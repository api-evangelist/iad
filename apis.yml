name: IAD
description: IAD Group (I@D International) is a European real-estate network company that
  combines real estate, digital tools, and network marketing to digitalize the traditional
  agency model through a network of independent agents rather than brick-and-mortar offices.
  Founded in France, IAD operates across France, Portugal, Spain, Italy, Germany, Mexico,
  the United Kingdom, and the United States (Florida), with roughly 20,000 independent
  agents, around 500 employees, more than 96,000 online property listings, and 521 million
  euros in 2025 turnover. It is a portfolio company of Insight Partners. IAD publishes a
  consumer/agent web presence but no public developer platform or API surface at this time.
